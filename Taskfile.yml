version: '3'

vars:
  SITE_DOCKER_FLAGS: >-
    -v ./www:/docs
    -v ./LICENSE:/docs/docs/LICENSE
    -v ./SECURITY.md:/docs/docs/security.md
    -v ./CHANGELOG.md:/docs/docs/changelog.md
    -v ./CODE-OF-CONDUCT.md:/docs/docs/code-of-conduct.md
    -v ./CONTRIBUTING.md:/docs/docs/contributing.md

tasks:
  build-frontend:
    desc: Build frontend assets
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run build

  build-backend:
    desc: Build backend binary
    cmds:
      - go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o filebrowser .
    vars:
      GIT_COMMIT:
        sh: git log -n 1 --format=%h
      VERSION:
        sh: git describe --tags --abbrev=0 --match=v* | cut -c 2-
    env:
      CGO_ENABLED: 0

  build:
    desc: Build both frontend and backend
    cmds:
      - task: build-frontend
      - task: build-backend

  builder-image:
    desc: Build docker image for compiling
    cmds:
      - docker build --rm --build-arg UID={{.UID}} --build-arg GID={{.GID}} -f builder/Dockerfile -t filebrowser-builder:latest ./builder
    vars:
      UID:
        sh: id -u
      GID:
        sh: id -g

  build-in-container:
    desc: Build artifacts in a container
    cmds:
      - task: builder-image
      - docker run --rm --entrypoint /bin/bash -e GOCACHE=/home/user/{{.DIRNAME}}/.cache/go-build -e GOMODCACHE=/home/user/{{.DIRNAME}}/.cache/mod -v {{.ROOT_DIR}}:/home/user/{{.DIRNAME}} -w /home/user/{{.DIRNAME}} filebrowser-builder:latest -c '\. "$HOME/.nvm/nvm.sh" && task build'
    vars:
      DIRNAME:
        sh: basename {{.ROOT_DIR}}

  test-in-container:
    desc: Run tests in a container
    cmds:
      - task: builder-image
      - docker run --rm --entrypoint /bin/bash -e GOCACHE=/home/user/{{.DIRNAME}}/.cache/go-build -e GOMODCACHE=/home/user/{{.DIRNAME}}/.cache/mod -e GOLANGCI_LINT_CACHE=/home/user/{{.DIRNAME}}/.cache/golangci-lint -v {{.ROOT_DIR}}:/home/user/{{.DIRNAME}} -w /home/user/{{.DIRNAME}} filebrowser-builder:latest -c '\. "$HOME/.nvm/nvm.sh" && pushd frontend && pnpm install --frozen-lockfile && pnpm run lint && popd && golangci-lint run && go test --race ./...'
    vars:
      DIRNAME:
        sh: basename {{.ROOT_DIR}}

  build-image:
    desc: Build filebrowser container image
    cmds:
      - task: build-in-container
      - docker build -t filebrowser:latest .

  release-make:
    internal: true
    prompt: Do you wish to proceed?
    cmds:
      - pnpm dlx commit-and-tag-version -s

  release-dry-run:
    internal: true
    cmds:
      - pnpm dlx commit-and-tag-version --dry-run --skip

  release:
    desc: Create a new release
    cmds:
      - task: release-dry-run
      - task: release-make

  docs-image-make:
    internal: true
    cmds: 
      - docker build -f www/Dockerfile --progress=plain -t filebrowser.site www

  docs:
    desc: Generate documentation
    cmds:
      - rm -rf www/public
      - task: docs-image-make
      - docker run --rm {{.SITE_DOCKER_FLAGS}} filebrowser.site build -d "public"

  docs-serve:
    desc: Serve documentation
    cmds:
      - task: docs-image-make
      - docker run --rm -it -p 8000:8000 {{.SITE_DOCKER_FLAGS}} filebrowser.site
